[package]
name = "bevy_noodle"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "A headless, entity-based node graph library for Bevy UI: you style the nodes, it handles the graph."
license = "MIT"
readme = "README.md"
repository = "https://github.com/gold-silver-copper/bevy_noodle"
documentation = "https://docs.rs/bevy_noodle"
keywords = ["bevy", "node-graph", "node-editor", "visual-scripting", "ui"]
categories = ["game-development", "gui", "visualization"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "examples/**", "tests/**"]

[features]
default = []
# Optional look: wire and grid shaders, selection box, port highlighting and
# node-building helpers. The core draws nothing.
default_style = ["bevy/ui_bevy_render"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "ui_api",
    "bevy_picking",
    "ui_picking",
] }

[dev-dependencies]
bevy = "0.19"

[[example]]
name = "styled"
required-features = ["default_style"]

[[example]]
name = "math_graph"
required-features = ["default_style"]

[package.metadata.docs.rs]
all-features = true
