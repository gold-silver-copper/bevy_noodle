[package]
name = "bevy_noodle"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
description = "A headless, entity-based node graph library for Bevy UI: you style the nodes, it handles the graph."
license = "MIT"
readme = "README.md"
repository = "https://github.com/gold-silver-copper/bevy_noodle"
documentation = "https://docs.rs/bevy_noodle"
keywords = ["bevy", "node-graph", "node-editor", "visual-scripting", "ui"]
categories = ["game-development", "gui", "visualization"]
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "src/**", "examples/**", "tests/**"]

[features]
default = []
# Optional look: wire and grid shaders, selection box, port highlighting and
# node-building helpers. The core draws nothing.
default_style = ["bevy/ui_bevy_render"]
# Graph snapshots (save/load, undo) with Bevy's `DynamicWorld`.
scene = ["bevy/bevy_world_serialization"]

[dependencies]
bevy = { version = "0.20.0-rc.2", default-features = false, features = [
    "ui_api",
    "bevy_picking",
    "ui_picking",
] }

# Bevy's recommended setup: optimized dependencies make the examples fast
# without `--release`. Only applies when building this repository.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
bevy = { version = "0.20.0-rc.2", features = ["bevy_feathers"] }
# Reading saved graphs in the save_load example.
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[[test]]
name = "scene"
required-features = ["scene"]

[[example]]
name = "styled"
required-features = ["default_style"]

[[example]]
name = "math_graph"
required-features = ["default_style"]

[[example]]
name = "edge_styles"
required-features = ["default_style"]

[[example]]
name = "editor"
required-features = ["default_style", "scene"]

[[example]]
name = "save_load"
required-features = ["default_style", "scene"]

[[example]]
name = "subgraph"
required-features = ["default_style"]

[[example]]
name = "scene_builder_3d"
required-features = ["default_style"]

[[example]]
name = "stress"
required-features = ["default_style"]

[[example]]
name = "keyboard"
required-features = ["default_style"]

[[example]]
name = "comment_frames"
required-features = ["default_style"]

[[example]]
name = "reroute"
required-features = ["default_style"]

[[example]]
name = "type_conversion"
required-features = ["default_style"]

[[example]]
name = "minimap"
required-features = ["default_style"]

[[example]]
name = "auto_layout"
required-features = ["default_style"]

[package.metadata.docs.rs]
all-features = true
