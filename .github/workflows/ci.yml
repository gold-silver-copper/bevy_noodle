name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No debug info: smaller caches and faster links on CI.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Bevy's Linux dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - name: Clippy, for each feature combination
        run: |
          for features in "" default_style scene default_style,scene; do
            cargo clippy --locked --all-targets --no-default-features --features "$features" -- -D warnings
          done
      - run: cargo test --locked --all-features
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify the release package
        run: cargo publish --dry-run --locked --all-features

  library:
    name: Library (${{ matrix.toolchain }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: '1.97.1'
          - os: windows-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # Building only the library keeps Bevy's dev-dependency features out.
      - name: Check each feature combination without dev dependencies
        shell: bash
        run: |
          for features in "" default_style scene default_style,scene; do
            cargo check --locked --lib --no-default-features --features "$features"
          done
